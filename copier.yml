_subdirectory: template

_tasks:
  - "git init"
  - "mise trust"
  - "mise install"

tenant:
  type: str
  help: "Tenant slug (URL-friendly)"
  placeholder: "acme-corp"

github_org:
  type: str
  help: "GitHub org of the tenant (image registry owner and forge org)"
  default: "{{ tenant }}"

infrastructure:
  type: bool
  help: "Does this tenant build its own infrastructure layer (Proxmox hypervisor, backup server, ingress VM) instead of buying hosts from a provider?"
  default: false

renovate_reviewers:
  type: str
  help: "GitHub logins the update bot requests a review from on every PR, comma-separated (empty: none); the bot's automerged tier included, so they show on the reviewer's dashboard"
  default: ""
